<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TEA BASE{% endblock %} · ПЧК</title>
<style>
  :root {
    --bg: #ECEBE3; --card: #FFFFFF; --ink: #2C2C26;
    --green: #6C7159; --dark: #494E31; --brown: #33210D; --wine: #4E000A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Mulish', -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  header {
    background: var(--dark); color: #ECEBE3;
    padding: 14px 24px; display: flex; align-items: baseline; gap: 14px;
  }
  header a { color: inherit; text-decoration: none; }
  header .logo { font-weight: 800; font-size: 20px; letter-spacing: .5px; }
  header .sub { opacity: .75; font-size: 14px; }
  header .right { margin-left: auto; font-size: 14px; opacity: .85; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  .crumbs { font-size: 14px; margin-bottom: 18px; color: var(--green); }
  .crumbs a { color: var(--green); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  h1 { font-size: 26px; color: var(--dark); margin: 0 0 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .card {
    display: block; background: var(--card); border-radius: 14px;
    padding: 26px 24px; text-decoration: none; color: var(--ink);
    border: 1px solid #dcdacd; transition: transform .08s, box-shadow .08s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(73,78,49,.14); }
  .card .t { font-size: 20px; font-weight: 800; color: var(--dark); }
  .card .d { margin-top: 6px; font-size: 14px; color: var(--green); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .chip {
    padding: 6px 14px; border-radius: 999px; font-size: 14px; text-decoration: none;
    background: #fff; color: var(--dark); border: 1px solid #cfcdbd;
  }
  .chip.on { background: var(--dark); color: #fff; border-color: var(--dark); }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  th { background: var(--dark); color: #fff; text-align: left; font-size: 14px; padding: 10px 12px; }
  td { padding: 9px 12px; border-top: 1px solid #eceade; font-size: 15px; }
  tr:hover td { background: #f7f6ee; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .price { color: var(--wine); font-weight: 700; }
  .muted { color: #9a9a8a; font-size: 13px; }
  .btn {
    display: inline-block; background: var(--wine); color: #fff; text-decoration: none;
    padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 15px;
  }
  .btn:hover { filter: brightness(1.15); }
  .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .rcard { background: #fff; border: 1px solid #dcdacd; border-radius: 12px; overflow: hidden; }
  .rcard img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #f1f0e7; }
  .rcard .noimg { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
                  background: #f1f0e7; color: #b9b7a5; font-size: 34px; }
  .rcard .p { padding: 10px 12px; }
  .rcard .a { font-size: 13px; color: var(--green); }
  .rcard .n { font-size: 15px; font-weight: 700; color: var(--dark); }
  .empty { padding: 40px; text-align: center; color: #9a9a8a; background: #fff; border-radius: 12px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eee; color: #888; }
</style>
</head>
<body>
<header>
  <a href="/" class="logo">ПЧК · TEA BASE</a>
  <span class="sub">внутренний каталог</span>
  <span class="right">
    {% if user.is_authenticated %}{{ user.username }} · <a href="/admin/">админка</a> · <a href="/admin/logout/">выйти</a>{% endif %}
  </span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
