server {
    server_name tea01.ru www.tea01.ru;
    client_max_body_size 10m;
    root /var/www/tea01;
    index index.html;

    # Главная — входная страница (Ассортимент / Ozon)
    location = / {
        try_files /landing.html =404;
    }

    # React-приложение (SPA)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }

    # Django-витрина и её админка
    location /dj/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tea01.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tea01.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.tea01.ru) { return 301 https://$host$request_uri; } # managed by Certbot
    if ($host = tea01.ru) { return 301 https://$host$request_uri; } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name tea01.ru www.tea01.ru;
    return 404; # managed by Certbot
}
